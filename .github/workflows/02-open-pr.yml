name: "02 - Auto Open Pull Request"

on:
  workflow_run:
    workflows: ["01 - Validate Infrastructure"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-open-pr:
    name: "Create PR on Validation Success"
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Validações do 01-validate concluídas com SUCESSO! Criando Pull Request para $BRANCH_NAME..."
            gh pr create \
              --title "feat: $BRANCH_NAME" \
              --body "🚀 **Pull Request gerado automaticamente pelo CI**\n\n- ✅ Validação do Terraform (01-validate) passou com sucesso!\n\nPor favor, revise a infraestrutura e faça o merge para aplicar na AWS." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "Pull Request #$PR_EXISTS já existe para a branch $BRANCH_NAME."
          fi

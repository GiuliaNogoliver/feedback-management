name: "02 - Auto Open Pull Request"

on:
  push:
    branches-ignore:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  auto-open-pr:
    name: "Validate & Create PR"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454634138220:role/GitHubActionsDeployRole
          aws-region: sa-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate & Plan
        run: |
          terraform validate
          terraform plan -no-color

      - name: Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            echo "Validações OK! Criando Pull Request para a branch $BRANCH_NAME..."
            gh pr create \
              --title "feat: $BRANCH_NAME" \
              --body "🚀 **Pull Request gerado automaticamente**\n\n- ✅ Infraestrutura validada com sucesso pelo pipeline de CI\n\nPor favor, revise o plano e faça o merge." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "Pull Request #$PR_EXISTS já existe para a branch $BRANCH_NAME."
          fi

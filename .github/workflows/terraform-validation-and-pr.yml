name: "CI - Terraform Validation & Auto-PR"

on:
  push:
    branches-ignore:
      - main

permissions:
  id-token: write      # Autenticação OIDC na AWS
  contents: read       # Leitura do repositório
  pull-requests: write # Permissão para abrir PRs automaticamente

jobs:
  validate-plan-and-auto-pr:
    name: "Validate, Plan & Auto-PR"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454634138220:role/GitHubActionsDeployRole
          aws-region: sa-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Auto-Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Validações OK! Criando Pull Request para a branch $BRANCH_NAME..."
            gh pr create \
              --title "feat: $BRANCH_NAME" \
              --body "🚀 **Pull Request gerado automaticamente pelo CI**\n\n- ✅ \`terraform validate\` passou com sucesso\n- ✅ \`terraform plan\` executado com sucesso\n\nPor favor, revise o plano e faça o merge para aplicar as mudanças na AWS." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "Pull Request #$PR_EXISTS já está aberto para a branch $BRANCH_NAME."
          fi

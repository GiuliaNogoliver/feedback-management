name: "01 - PR Pipeline (Validate & Auto-PR)"

on:
  push:
    branches-ignore:
      - main

permissions:
  id-token: write      # Autenticação OIDC na AWS
  contents: read       # Leitura do repositório
  pull-requests: write # Permissão para criar Pull Requests

jobs:
  # -------------------------------------------------------------
  # Job 1: Validações e Plan do Terraform
  # -------------------------------------------------------------
  validate-and-plan:
    name: "Validate & Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454634138220:role/GitHubActionsDeployRole
          aws-region: sa-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

  # -------------------------------------------------------------
  # Job 2: Abertura Automática do PR (Roda apenas se Job 1 passar)
  # -------------------------------------------------------------
  create-pull-request:
    name: "Auto-Create Pull Request"
    needs: validate-and-plan # Garante dependência estrita do Job 1!
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Validações OK! Criando Pull Request para a branch $BRANCH_NAME..."
            gh pr create \
              --title "feat: $BRANCH_NAME" \
              --body "" \
              --base main \
              --head "$BRANCH_NAME" || echo "Aviso: Não foi possível criar o PR automático (a branch pode estar zerada em relação à main ou o PR foi criado manualmente)."
          else
            echo "Pull Request #$PR_EXISTS já está aberto para a branch $BRANCH_NAME."
          fi
